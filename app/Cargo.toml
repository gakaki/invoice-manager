[package]
name = "invoice-manager"
version = "1.0.0"
edition = "2024"
publish = false
description = "发票管理 — cross-platform (macOS/Android) invoice manager built with Native Shell (nsh.dev) in Rust"

[workspace]

[lib]
name = "invoice_manager"
path = "src/lib.rs"

[[bin]]
name = "invoice-manager"
path = "src/main.rs"

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = { version = "0.4.0", default-features = false }
